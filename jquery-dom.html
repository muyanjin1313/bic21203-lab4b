<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery DOM Operations</title>
    <style>
        .myStyle { background-color: coral; padding: 16px; }
    </style>
    <!-- Include jQuery 4.0.0 full-build CDN -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>
    <div id="myElement">Original Text</div>
    <div id="myDIV"><p>I am a myDIV.</p></div>
    <button id="myButton">Click me</button>

    <script>
        // Ensure the DOM is fully loaded before executing jQuery
        $(document).ready(function() {
            
            // (a) Replace text (Native: textContent)
            $("#myElement").text("Modified Text");
            
            // (b) Add class (Native: classList.add)
            $("#myDIV").addClass("myStyle");
            
            // (c) Add click event listener (Native: addEventListener)
            $("#myButton").on("click", function() {
                alert("Button clicked!");
            });
            
        });
    </script>
</body>
</html>
